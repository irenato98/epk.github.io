  <style>
    :root {
      color-scheme: dark;
      --accent: #4bb7d5;
      --slide-ratio: 841 / 595;
    }

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      background: #11100f;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: #11100f;
      overflow-x: hidden;
    }

    main {
      width: 100%;
      margin: 0 auto;
      padding: 0;
    }

    /* En desktop el slide conserva su altura completa y queda centrado,
       dejando los bordes negros laterales de la referencia. */
    @media (min-width: 768px) {
      main {
        width: 141.3445vh;
        max-width: 100%;
      }
    }

    /* Cada sección conserva exactamente la proporción del slide.
       No se usa 100vh, evitando el hueco grande en móviles verticales. */
    .slide {
      position: relative;
      width: 100%;
      aspect-ratio: var(--slide-ratio);
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #11100f;
      line-height: 0;
    }

    .slide-image {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    .embed {
      position: absolute;
      z-index: 2;
      overflow: hidden;
      background: #000;
      line-height: normal;
    }

    .embed iframe {
      display: block;
      width: 100%;
      border: 0;
    }

    /* Enlaces interactivos superpuestos sobre las imágenes. */
    .hotspot {
      position: absolute;
      z-index: 3;
      display: block;
      background: transparent;
      border-radius: 10px;
      line-height: normal;
      cursor: pointer;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
    }

    .hotspot:focus-visible {
      outline: none;
    }

    .video-hotspot::before,
    .contact-hotspot::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      border: 3px solid var(--accent);
      border-radius: inherit;
      background: rgba(24, 73, 84, 0.34);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
      opacity: 0;
      transform: scale(0.985);
      transition: opacity 150ms ease, transform 150ms ease;
      pointer-events: none;
    }

    .video-hotspot::after {
      content: "▶";
      position: absolute;
      top: 50%;
      left: 50%;
      display: grid;
      width: 18%;
      aspect-ratio: 1;
      place-items: center;
      padding-left: 2%;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.78);
      box-shadow: 0 3px 18px rgba(0, 0, 0, 0.42);
      color: #fff;
      font: 700 clamp(17px, 2vw, 34px)/1 Arial, sans-serif;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.88);
      transition: opacity 150ms ease, transform 150ms ease;
      pointer-events: none;
    }

    .contact-hotspot::before {
      inset: -18% -2.5%;
      border-width: 2px;
      border-radius: 9px;
      background: rgba(24, 73, 84, 0.28);
    }

    .contact-hotspot::after {
      content: attr(data-icon);
      position: absolute;
      top: 50%;
      right: -8%;
      display: grid;
      width: min(2.35vw, 34px);
      min-width: 20px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font: 700 clamp(12px, 1.15vw, 18px)/1 Arial, sans-serif;
      opacity: 0;
      transform: translateY(-50%) scale(0.82);
      transition: opacity 150ms ease, transform 150ms ease;
      pointer-events: none;
    }

    .video-hotspot:hover::before,
    .video-hotspot:focus-visible::before,
    .video-hotspot:active::before,
    .video-hotspot.is-interacting::before,
    .contact-hotspot:hover::before,
    .contact-hotspot:focus-visible::before,
    .contact-hotspot:active::before,
    .contact-hotspot.is-interacting::before {
      opacity: 1;
      transform: scale(1);
    }

    .video-hotspot:hover::after,
    .video-hotspot:focus-visible::after,
    .video-hotspot:active::after,
    .video-hotspot.is-interacting::after,
    .contact-hotspot:hover::after,
    .contact-hotspot:focus-visible::after,
    .contact-hotspot:active::after,
    .contact-hotspot.is-interacting::after {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .contact-hotspot:hover::after,
    .contact-hotspot:focus-visible::after,
    .contact-hotspot:active::after,
    .contact-hotspot.is-interacting::after {
      transform: translateY(-50%) scale(1);
    }

    .video-link-1 { left: 6.78%; top: 64.18%; width: 27.94%; height: 22.35%; }
    .video-link-2 { left: 37.89%; top: 63.76%; width: 29.13%; height: 23.19%; }
    .video-link-3 { left: 70.06%; top: 62.12%; width: 24.85%; height: 26.56%; }


    /* Los tres cuadros inferiores funcionan como selectores del reproductor principal. */
    .video-hotspot {
      margin: 0;
      padding: 0;
      border: 0;
      overflow: hidden;
      appearance: none;
      -webkit-appearance: none;
      color: inherit;
    }

    .video-hotspot:disabled {
      cursor: wait;
    }

    .video-hotspot::before {
      z-index: 1;
    }

    .video-hotspot::after {
      z-index: 2;
    }

    .video-thumb {
      position: absolute;
      z-index: 0;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: cover;
      opacity: 0;
      transition: opacity 120ms ease;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .video-thumb.is-visible {
      opacity: 1;
    }

    /* Las áreas de contacto cubren únicamente el valor clicable, no toda la línea. */

    /* Subrayado permanente, ajustado al ancho de cada dato de contacto. */
    .contact-hotspot {
      --contact-line-size: clamp(2px, 0.18vw, 3px);
      background-image: linear-gradient(90deg, var(--accent), var(--accent));
      background-repeat: no-repeat;
      background-position: center bottom;
      background-size: 100% var(--contact-line-size);
      transition:
        background-size 160ms ease,
        filter 160ms ease,
        transform 160ms ease;
    }

    /* El mismo efecto luminoso del menú principal, también en toque y teclado. */
    .contact-hotspot:hover,
    .contact-hotspot:focus-visible,
    .contact-hotspot:active,
    .contact-hotspot.is-interacting {
      background-size: 100% clamp(3px, 0.24vw, 4px);
      filter:
        drop-shadow(0 0 4px rgba(75, 183, 213, 0.95))
        drop-shadow(0 0 8px rgba(75, 183, 213, 0.58));
    }

    .contact-hotspot:active,
    .contact-hotspot.is-interacting {
      transform: scale(0.985);
    }

    .contact-email { left: 38.10%; top: 38.50%; width: 32.05%; height: 5.25%; }
    .contact-phone { left: 41.85%; top: 47.28%; width: 14.60%; height: 5.25%; }
    .contact-instagram { left: 43.70%; top: 56.05%; width: 15.90%; height: 5.25%; }

    /* Slide 2: únicamente el video grande queda reproducible dentro de la página. */
    .youtube-embed {
      left: 30.25%;
      top: 21.80%;
      width: 43.90%;
      height: 34.90%;
      overflow: visible;
    }

    .youtube-embed iframe {
      position: absolute;
      inset: 0;
      height: 100%;
    }

    /* Control propio de audio: siempre visible y con el branding del EPK. */
    .youtube-audio-toggle {
      position: absolute;
      z-index: 4;
      top: 10px;
      right: 10px;
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 13px;
      border: 2px solid var(--accent);
      border-radius: 999px;
      background: rgba(17, 16, 15, 0.90);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.42), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
      color: #fff;
      font: 700 clamp(10px, 0.92vw, 14px)/1 Arial, sans-serif;
      letter-spacing: 0.02em;
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      transition: background 150ms ease, color 150ms ease, transform 150ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .youtube-audio-toggle:hover,
    .youtube-audio-toggle:focus-visible,
    .youtube-audio-toggle[aria-pressed="true"] {
      background: var(--accent);
      color: #11100f;
    }

    .youtube-audio-toggle:active {
      transform: scale(0.96);
    }

    .youtube-audio-toggle:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .youtube-audio-toggle:disabled {
      cursor: wait;
      opacity: 0.72;
    }

    .youtube-audio-toggle svg {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .youtube-audio-toggle .audio-icon-on {
      display: none;
    }

    .youtube-audio-toggle[aria-pressed="true"] .audio-icon-off {
      display: none;
    }

    .youtube-audio-toggle[aria-pressed="true"] .audio-icon-on {
      display: block;
    }

    /* Slide 4: proporciones y posición de la referencia de SoundCloud. */
    .soundcloud-embed {
      left: 17.72%;
      top: 29.95%;
      width: 64.80%;
      height: 52.05%;
      background: transparent;
      overflow: visible;
    }

    .soundcloud-embed iframe {
      height: calc(100% - 14px);
      background: #fff;
    }

    .soundcloud-player-list {
      display: none !important;
    }

    .soundcloud-credit {
      height: 14px;
      padding-top: 2px;
      overflow: hidden;
      color: #ccc;
      font: 100 10px/12px Interstate, "Lucida Grande", "Lucida Sans Unicode", "Lucida Sans", Garuda, Verdana, Tahoma, sans-serif;
      white-space: nowrap;
      text-overflow: ellipsis;
      word-break: normal;
    }

    .soundcloud-credit a {
      color: #ccc;
      text-decoration: none;
    }

    /* Navegación lateral discreta, equivalente al indicador original. */
    .slide-nav {
      position: fixed;
      z-index: 10;
      top: 50%;
      right: max(10px, env(safe-area-inset-right));
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 9px;
      border-radius: 22px;
      background: rgba(0, 0, 0, 0.58);
      transform: translateY(-50%);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .slide-nav button {
      width: 12px;
      height: 12px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #777;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease;
    }

    .slide-nav button[aria-current="true"] {
      background: var(--accent);
      transform: scale(1.18);
    }

    .slide-nav button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    @media (max-width: 767px) {
      .youtube-audio-toggle {
        top: 6px;
        right: 6px;
        width: 38px;
        min-width: 38px;
        height: 38px;
        min-height: 38px;
        padding: 0;
      }

      .youtube-audio-toggle .audio-toggle-label {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .soundcloud-player-visual {
        display: none !important;
      }

      .soundcloud-player-list {
        display: block !important;
      }
    }

    @media (max-width: 600px) {
      .slide-nav {
        right: max(7px, env(safe-area-inset-right));
        gap: 8px;
        padding: 10px 7px;
      }

      .slide-nav button {
        width: 10px;
        height: 10px;
      }

      .soundcloud-credit {
        font-size: 7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .slide-nav button {
        transition: none;
      }
    }
  </style>
</head>

  <script>
    (() => {
      const slides = [...document.querySelectorAll('.slide')];
      const buttons = [...document.querySelectorAll('.slide-nav button')];

      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          document.getElementById(button.dataset.target)?.scrollIntoView({ block: 'start' });
        });
      });

      const setActive = (id) => {
        buttons.forEach((button) => {
          button.setAttribute('aria-current', String(button.dataset.target === id));
        });
      };

      document.querySelectorAll('.hotspot').forEach((link) => {
        link.addEventListener('pointerdown', () => {
          link.classList.add('is-interacting');
          window.setTimeout(() => link.classList.remove('is-interacting'), 700);
        });
      });

      const observer = new IntersectionObserver((entries) => {
        const visible = entries
          .filter((entry) => entry.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (visible) setActive(visible.target.id);
      }, {
        rootMargin: '-35% 0px -35% 0px',
        threshold: [0, 0.1, 0.25, 0.5, 0.75, 1]
      });

      slides.forEach((slide) => observer.observe(slide));

      /* Botón permanente para activar y desactivar el sonido del video principal. */
      const audioButton = document.getElementById('youtube-audio-toggle');
      const audioLabel = audioButton?.querySelector('.audio-toggle-label');
      const videoSelectors = [...document.querySelectorAll('.video-hotspot[data-video-id]')];
      let youtubePlayer = null;
      let youtubePlayerIsReady = false;
      let currentVideoId = 'rk9Wt1S_M_A';

      const updateAudioButton = (soundIsOn) => {
        if (!audioButton) return;
        const label = soundIsOn ? 'Silenciar' : 'Activar sonido';
        audioButton.setAttribute('aria-pressed', String(soundIsOn));
        audioButton.setAttribute('aria-label', label);
        audioButton.title = label;
        if (audioLabel) audioLabel.textContent = label;
      };

      const showVideoThumbnail = (selector, videoId) => {
        let thumbnail = selector.querySelector('.video-thumb');

        if (!thumbnail) {
          thumbnail = document.createElement('img');
          thumbnail.className = 'video-thumb';
          thumbnail.alt = '';
          thumbnail.setAttribute('aria-hidden', 'true');
          selector.prepend(thumbnail);
        }

        thumbnail.classList.remove('is-visible');
        thumbnail.onload = () => thumbnail.classList.add('is-visible');
        thumbnail.onerror = () => thumbnail.remove();
        thumbnail.src = `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
      };

      const exchangeWithMainPlayer = (selector) => {
        if (!youtubePlayer || !youtubePlayerIsReady) return;

        const selectedVideoId = selector.dataset.videoId;
        if (!selectedVideoId || selectedVideoId === currentVideoId) return;

        const previousMainVideoId = currentVideoId;
        currentVideoId = selectedVideoId;
        selector.dataset.videoId = previousMainVideoId;
        showVideoThumbnail(selector, previousMainVideoId);

        youtubePlayer.loadVideoById(selectedVideoId);
        youtubePlayer.setVolume(100);
        youtubePlayer.unMute();
        youtubePlayer.playVideo();
        updateAudioButton(true);
      };

      videoSelectors.forEach((selector) => {
        selector.addEventListener('click', () => exchangeWithMainPlayer(selector));
      });

      window.onYouTubeIframeAPIReady = () => {
        youtubePlayer = new YT.Player('youtube-player', {
          events: {
            onReady: (event) => {
              youtubePlayerIsReady = true;
              event.target.mute();
              updateAudioButton(false);
              audioButton?.removeAttribute('disabled');
              videoSelectors.forEach((selector) => selector.removeAttribute('disabled'));
              event.target.playVideo();
            }
          }
        });
      };

      audioButton?.addEventListener('click', () => {
        if (!youtubePlayer || typeof youtubePlayer.isMuted !== 'function') return;

        if (youtubePlayer.isMuted() || youtubePlayer.getVolume() === 0) {
          youtubePlayer.setVolume(100);
          youtubePlayer.unMute();
          updateAudioButton(true);
        } else {
          youtubePlayer.mute();
          updateAudioButton(false);
        }
      });

      if (window.YT?.Player) {
        window.onYouTubeIframeAPIReady();
      } else if (!document.querySelector('script[src="https://www.youtube.com/iframe_api"]')) {
        const youtubeApiScript = document.createElement('script');
        youtubeApiScript.src = 'https://www.youtube.com/iframe_api';
        youtubeApiScript.async = true;
        document.head.appendChild(youtubeApiScript);
      }
    })();
  </script>
</body>
</html>
