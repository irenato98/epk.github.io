    :root {
      color-scheme: dark;
      --accent: #4bb7d5;
      --accent-soft: rgba(75, 183, 213, 0.35);
      --ink: #11100f;
      --slide-ratio: 16 / 9;
    }

    * { box-sizing: border-box; }

    html {
      margin: 0;
      background: var(--ink) url("../assets/background-1.png") center / cover fixed;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;

      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .slide {
      position: relative;
      width: 100%;
      aspect-ratio: var(--slide-ratio);
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--ink) url("../assets/background-1.png") center / cover;
      line-height: 0;
      scroll-snap-align: start;
      scroll-margin-top: 0;

    .slide-picture,
    .slide-image,
    .hero-video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    .slide-picture {
      pointer-events: none;
    }

    .mobile-only { display: none; }

    /* Hero con el video original, en silencio y en loop. */
    .hero-video {
      z-index: 0;
      object-fit: cover;
      background: #000;
      pointer-events: none;
    }

    .hero::after {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.22), transparent 46%),
        linear-gradient(270deg, rgba(0, 0, 0, 0.34), transparent 52%);
      pointer-events: none;
    }

    .hero-title {
      position: absolute;
      z-index: 2;
      top: 7.1%;
      left: 3.15%;
      margin: 0;
      color: var(--accent);
      font-size: clamp(20px, 2.55vw, 49px);
      font-weight: 800;
      letter-spacing: 0.035em;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }

    .hero-menu {
      position: absolute;
      z-index: 3;
      right: 4.15%;
      top: 53.1%;
      display: grid;
      justify-items: end;
      gap: clamp(3px, 0.55vw, 11px);
      line-height: normal;
    }

    .hero-link {
      display: inline-block;
      padding: 0.08em 0 0.12em;
      border-radius: 3px;
      background-image: linear-gradient(currentColor, currentColor);
      background-repeat: no-repeat;
      background-position: right bottom;
      background-size: 100% max(1px, 0.07em);
      color: #fff;
      font-size: clamp(12px, 2.25vw, 44px);
      font-weight: 800;
      line-height: 1.05;
      text-align: right;
      text-decoration: none;
      text-shadow: 0 2px 9px rgba(0, 0, 0, 0.82);
      -webkit-tap-highlight-color: transparent;
      transition:
        color 160ms ease,
        filter 160ms ease,
        transform 160ms ease,
        background-size 160ms ease;
    }

    .hero-link:hover,
    .hero-link:focus-visible,
    .hero-link:active,
    .hero-link.is-interacting {
      color: #d9fbff;
      filter:
        drop-shadow(0 0 4px rgba(75, 183, 213, 0.95))
        drop-shadow(0 0 9px rgba(75, 183, 213, 0.7));
      transform: translateX(-0.18em);
      background-size: 100% max(2px, 0.105em);
      outline: none;
    }

    .hero-link:active,
    .hero-link.is-interacting {
      transform: translateX(-0.18em) scale(0.985);
    }

    .embed {
      position: absolute;
      z-index: 2;
      overflow: hidden;
      background: #000;
      line-height: normal;
    }

    .embed iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Live Performance: el video ocupa únicamente el cuadro central. */

      left: 10.0521%;

    .youtube-embed:fullscreen,
    .youtube-embed:-webkit-full-screen,
    .youtube-embed.is-pseudo-fullscreen {
      position: fixed !important;
      z-index: 9999 !important;
      inset: 0 !important;
      width: 100vw !important;
      width: 100dvw !important;
      height: 100vh !important;
      height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      margin: 0 !important;
      border-radius: 0 !important;
      background: #000;
      box-shadow: none;
    }

    }

    .youtube-embed:-webkit-full-screen iframe,
    .youtube-embed.is-pseudo-fullscreen iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;

    .video-controls {
      position: absolute;
      z-index: 5;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 8px;
      line-height: normal;
    }

    .video-control {
      appearance: none;
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 13px;
      border: 2px solid var(--accent);
      border-radius: 999px;
      background: rgba(17, 16, 15, 0.9);
      box-shadow:

      letter-spacing: 0.02em;
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      -webkit-tap-highlight-color: transparent;
      transition: background 150ms ease, color 150ms ease, transform 150ms ease;
    }

    .video-control:hover,
    .video-control:focus-visible,

      background: var(--accent);
      color: var(--ink);
      outline: none;
    }

      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .video-control:active { transform: scale(0.96); }
    .video-control:disabled { cursor: wait; opacity: 0.72; }

    .video-control svg {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;

    .fullscreen-icon-close { display: none; }

    #youtube-fullscreen-toggle[aria-pressed="true"] .fullscreen-icon-open { display: none; }

    #youtube-audio-toggle[aria-pressed="true"] .audio-icon-on,
    #youtube-fullscreen-toggle[aria-pressed="true"] .fullscreen-icon-close { display: block; }

    /* The three right-hand images select a video and exchange it with the main player,
       preserving the interaction from the previous HTML. */
    .performance-selector {
      position: absolute;
      z-index: 4;
      display: block;
      margin: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 4px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      color: inherit;
      cursor: pointer;
      isolation: isolate;
      line-height: normal;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .performance-selector:disabled {
      cursor: wait;
      opacity: 0.82;
    }

    .performance-selector::before {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0;
      border: 3px solid var(--accent);
      border-radius: inherit;
      background: rgba(24, 73, 84, 0.26);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.16) inset,
        0 0 20px rgba(75, 183, 213, 0.52);
      opacity: 0;
      transform: scale(0.985);
      transition: opacity 150ms ease, transform 150ms ease;
      pointer-events: none;
    }

    .performance-selector::after {
      content: "▶";
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      display: grid;
      width: 18%;
      min-width: 28px;
      max-width: 58px;
      aspect-ratio: 1;
      place-items: center;
      padding-left: 2%;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font: 800 clamp(15px, 1.55vw, 28px)/1 Arial, sans-serif;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.84);
      transition: opacity 150ms ease, transform 150ms ease;
      pointer-events: none;
    }

    .performance-selector:hover::before,
    .performance-selector:focus-visible::before,
    .performance-selector:active::before,
    .performance-selector.is-interacting::before {
      opacity: 1;
      transform: scale(1);
    }

    .performance-selector:hover::after,
    .performance-selector:focus-visible::after,
    .performance-selector:active::after,
    .performance-selector.is-interacting::after {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .performance-selector:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .performance-selector:active,
    .performance-selector.is-interacting {
      transform: scale(0.985);
    }

    .performance-thumb {
      position: absolute;
      z-index: 0;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: cover;
      opacity: 0;
      transition: opacity 140ms ease;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .performance-thumb.is-visible { opacity: 1; }

    .performance-link-1 { left: 71.1979%; top: 21.2037%; width: 17.5521%; height: 17.5926%; }

    .recording-link::before,

    .recording-link:hover::before,

        border-width: 1px;
      }

      .video-control svg {
        width: 18px;
        height: 18px;
      }

      .control-label {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    }

    @media (hover: none) and (pointer: coarse) {
      .slide-nav { display: none; }

      /* Touch feedback stays on the target itself and never blocks its text/image. */
      .contact-hotspot::after { display: none; }

      /* Compact controls also in landscape phones whose CSS width is over 767px. */
      .video-controls {
        top: max(5px, env(safe-area-inset-top));
        right: max(5px, env(safe-area-inset-right));
        gap: 5px;
      }

      .video-control {
        width: 38px;
        min-width: 38px;
        height: 38px;
        min-height: 38px;
        padding: 0;
        border-width: 1px;
      }

      .video-control svg { width: 18px; height: 18px; }

      .control-label {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    }

    @media (max-width: 767px) {
      .video-controls { top: max(5px, env(safe-area-inset-top)); right: max(5px, env(safe-area-inset-right)); gap: 5px; }

      .video-control {
        width: 34px;
        min-width: 34px;
        height: 34px;
        min-height: 34px;

    @media (max-width: 600px) {
      .slide-nav {
        right: max(6px, env(safe-area-inset-right));
        gap: 7px;
        padding: 8px 6px;
      }

      .slide-nav button { width: 8px; height: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .hero-link,
      .performance-selector,
      .performance-selector::before,
      .performance-selector::after,
      .performance-thumb,
      .recording-link::before,
      .recording-link::after,
      .contact-hotspot::before,

      .slide-nav button { transition: none; }
    }

  <script>
    (() => {
      const slides = [...document.querySelectorAll('.slide')];
      const navButtons = [...document.querySelectorAll('.slide-nav button')];
      const interactiveItems = [...document.querySelectorAll('.hero-link, .hotspot')];

      const scrollToTarget = (id) => {
        document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      navButtons.forEach((button) => {
        button.addEventListener('click', () => scrollToTarget(button.dataset.target));
      });

      document.querySelectorAll('.hero-link').forEach((link) => {
        link.addEventListener('click', (event) => {
          const id = link.hash.slice(1);
          if (!id) return;
          event.preventDefault();
          history.replaceState(null, '', `#${id}`);
          scrollToTarget(id);
        });
      });

      interactiveItems.forEach((item) => {
        item.addEventListener('pointerdown', () => {
          item.classList.add('is-interacting');
          window.setTimeout(() => item.classList.remove('is-interacting'), 650);
        });
        item.addEventListener('pointercancel', () => item.classList.remove('is-interacting'));
      });

      const setActive = (id) => {
        navButtons.forEach((button) => {
          button.setAttribute('aria-current', String(button.dataset.target === id));
        });
      };

      const observer = new IntersectionObserver((entries) => {
        const visible = entries
          .filter((entry) => entry.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (visible) setActive(visible.target.id);
      }, {
        rootMargin: '-35% 0px -35% 0px',
        threshold: [0, 0.1, 0.25, 0.5, 0.75, 1]
      });

      slides.forEach((slide) => observer.observe(slide));

      /* El hero siempre permanece silenciado; no se expone ningún control de audio. */
      const heroVideo = document.querySelector('.hero-video');
      if (heroVideo) {
        heroVideo.muted = true;
        heroVideo.defaultMuted = true;
        heroVideo.play().catch(() => {});
      }

      /* Live Performance: player, audio, video exchange and mobile-safe fullscreen. */
      const videoContainer = document.getElementById('youtube-video-container');
      const audioButton = document.getElementById('youtube-audio-toggle');
      const audioLabel = document.getElementById('audio-toggle-label');
      const fullscreenButton = document.getElementById('youtube-fullscreen-toggle');
      const fullscreenLabel = document.getElementById('fullscreen-toggle-label');
      const videoSelectors = [...document.querySelectorAll('.performance-selector[data-video-id]')];
      let youtubePlayer = null;
      let youtubePlayerIsReady = false;
      let currentVideoId = 'H-t0T68zU3g';
      let pendingVideoSelector = null;

      const updateAudioButton = (soundIsOn) => {
        if (!audioButton) return;
        const label = soundIsOn ? 'Silenciar' : 'Activar sonido';
        audioButton.setAttribute('aria-pressed', String(soundIsOn));
        audioButton.setAttribute('aria-label', label);
        audioButton.title = label;
        if (audioLabel) audioLabel.textContent = label;
      };

      const showVideoThumbnail = (selector, videoId) => {
        let thumbnail = selector.querySelector('.performance-thumb');

        if (!thumbnail) {
          thumbnail = document.createElement('img');
          thumbnail.className = 'performance-thumb';
          thumbnail.alt = '';
          thumbnail.setAttribute('aria-hidden', 'true');
          selector.prepend(thumbnail);
        }

        thumbnail.classList.remove('is-visible');
        thumbnail.onload = () => thumbnail.classList.add('is-visible');
        thumbnail.onerror = () => thumbnail.remove();
        thumbnail.src = `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
      };

      const exchangeWithMainPlayer = (selector) => {
        if (!selector) return;
        if (!youtubePlayer || !youtubePlayerIsReady) {
          pendingVideoSelector = selector;
          return;
        }

        const selectedVideoId = selector.dataset.videoId;
        if (!selectedVideoId || selectedVideoId === currentVideoId) return;

        const previousMainVideoId = currentVideoId;
        currentVideoId = selectedVideoId;
        selector.dataset.videoId = previousMainVideoId;
        showVideoThumbnail(selector, previousMainVideoId);

        youtubePlayer.loadVideoById(selectedVideoId);
        youtubePlayer.setVolume(100);
        youtubePlayer.unMute();
        youtubePlayer.playVideo();
        updateAudioButton(true);
      };

      videoSelectors.forEach((selector) => {
        selector.addEventListener('click', () => exchangeWithMainPlayer(selector));
      });

      window.onYouTubeIframeAPIReady = () => {
        youtubePlayer = new YT.Player('youtube-player', {
          events: {
            onReady: (event) => {
              youtubePlayerIsReady = true;
              event.target.mute();
              event.target.playVideo();
              updateAudioButton(false);
              audioButton?.removeAttribute('disabled');
              videoSelectors.forEach((selector) => selector.removeAttribute('disabled'));

              if (pendingVideoSelector) {
                const selector = pendingVideoSelector;
                pendingVideoSelector = null;
                exchangeWithMainPlayer(selector);
              }
            }
          }
        });
      };

      audioButton?.addEventListener('click', () => {
        if (!youtubePlayer || typeof youtubePlayer.isMuted !== 'function') return;

        if (youtubePlayer.isMuted() || youtubePlayer.getVolume() === 0) {
          youtubePlayer.setVolume(100);
          youtubePlayer.unMute();
          updateAudioButton(true);
        } else {
          youtubePlayer.mute();
          updateAudioButton(false);
        }
      });

      if (window.YT?.Player) {
        window.onYouTubeIframeAPIReady();
      } else if (!document.querySelector('script[src="https://www.youtube.com/iframe_api"]')) {
        const youtubeApiScript = document.createElement('script');
        youtubeApiScript.src = 'https://www.youtube.com/iframe_api';
        youtubeApiScript.async = true;
        document.head.appendChild(youtubeApiScript);
      }

      const activeFullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;
      const isPseudoFullscreen = () => videoContainer?.classList.contains('is-pseudo-fullscreen');
      const isVideoFullscreen = () => activeFullscreenElement() === videoContainer || isPseudoFullscreen();

      const setPseudoFullscreen = (enabled) => {
        if (!videoContainer) return;
        videoContainer.classList.toggle('is-pseudo-fullscreen', enabled);
        document.documentElement.classList.toggle('video-fullscreen-open', enabled);
        document.body.classList.toggle('video-fullscreen-open', enabled);
      };

      const updateFullscreenButton = () => {
        const isFullscreen = isVideoFullscreen();
        const label = isFullscreen ? 'Salir de pantalla completa' : 'Pantalla completa';
        fullscreenButton?.setAttribute('aria-pressed', String(isFullscreen));
        fullscreenButton?.setAttribute('aria-label', isFullscreen ? 'Cerrar video en pantalla completa' : 'Ampliar video a pantalla completa');
        if (fullscreenButton) fullscreenButton.title = label;
        if (fullscreenLabel) fullscreenLabel.textContent = label;
      };

      const enterFullscreen = async () => {
        if (!videoContainer) return;

        if (videoContainer.requestFullscreen) {
          try {
            const result = videoContainer.requestFullscreen({ navigationUI: 'hide' });
            if (result && typeof result.then === 'function') await result;
            await new Promise((resolve) => requestAnimationFrame(resolve));
            if (activeFullscreenElement() === videoContainer) {
              updateFullscreenButton();
              return;
            }
          } catch (error) {
            /* Fall through to the CSS fullscreen used by iPhone Safari. */
          }
        } else if (videoContainer.webkitRequestFullscreen) {
          try {
            const result = videoContainer.webkitRequestFullscreen();
            if (result && typeof result.then === 'function') await result;
            await new Promise((resolve) => requestAnimationFrame(resolve));
            if (activeFullscreenElement() === videoContainer) {
              updateFullscreenButton();
              return;
            }
          } catch (error) {
            /* Fall through to the CSS fullscreen used by iPhone Safari. */
          }
        }

        setPseudoFullscreen(true);
        updateFullscreenButton();
      };

      const exitFullscreen = async () => {
        if (isPseudoFullscreen()) {
          setPseudoFullscreen(false);
          updateFullscreenButton();
          return;
        }

        const nativeExit = document.exitFullscreen || document.webkitExitFullscreen;
        if (nativeExit) {
          const result = nativeExit.call(document);
          if (result && typeof result.then === 'function') await result;
        }
      };

      fullscreenButton?.addEventListener('click', async () => {
        try {
          if (isVideoFullscreen()) {
            await exitFullscreen();
          } else {
            await enterFullscreen();
          }
        } catch (error) {
          setPseudoFullscreen(!isPseudoFullscreen());
          updateFullscreenButton();
        }
      });

      document.addEventListener('fullscreenchange', () => {
        if (activeFullscreenElement() !== videoContainer && isPseudoFullscreen()) {
          setPseudoFullscreen(false);
        }
        updateFullscreenButton();
      });
      document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && isPseudoFullscreen()) {
          setPseudoFullscreen(false);
          updateFullscreenButton();
        }
      });
      updateFullscreenButton();
    })();
  </script>
